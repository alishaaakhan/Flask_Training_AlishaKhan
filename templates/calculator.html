<body>

<div class="calculator">

    <h1>Simple Calculator</h1>

    <form method="POST">

        <input
            type="number"
            step="any"
            name="a"
            placeholder="Enter first number"
            required
        >

        <input
            type="number"
            step="any"
            name="b"
            placeholder="Enter second number"
            required
        >

        <br><br>

        <!-- Addition -->
        <button type="submit" name="operation" value="add">
            +
        </button>

        <!-- Subtraction -->
        <button type="submit" name="operation" value="sub">
            -
        </button>

        <!-- Multiplication -->
        <button type="submit" name="operation" value="mul">
            *
        </button>

        <!-- Division -->
        <button type="submit" name="operation" value="div">
            /
        </button>

    </form>

    {% if result is not none %}

    <div class="result">
        Result = {{ result }}
    </div>

    {% endif %}

</div>

</body>
